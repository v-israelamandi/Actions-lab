name: Hello Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions, Israel!"

      - name: Show what's in the repo
        run: ls -la
